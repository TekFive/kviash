name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(./gradlew -q properties --console=plain | awk -F ': ' '$1 == "version" { print $2; exit }')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Gradle project version must use the form 1.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: ./gradlew clean build --no-daemon

      - name: Create GitHub release
        shell: bash
        run: >-
          gh release create "${{ steps.release.outputs.tag }}" build/libs/*.jar
          --title "${{ steps.release.outputs.tag }}"
          --target "$GITHUB_SHA"
          --generate-notes

      - name: Trigger and verify JitPack release
        timeout-minutes: 15
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          pom_url="https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/${repository_name}-${RELEASE_TAG}.pom"

          for attempt in {1..10}; do
            echo "Requesting JitPack artifact (attempt ${attempt}/10): ${pom_url}"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              "$pom_url"; then
              echo "JitPack release ${RELEASE_TAG} is available."
              exit 0
            fi

            if (( attempt < 10 )); then
              sleep 15
            fi
          done

          echo "JitPack did not publish ${RELEASE_TAG} within the allowed time." >&2
          echo "Build log: https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/build.log" >&2
          exit 1
