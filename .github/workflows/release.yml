name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="$(./gradlew -q properties --console=plain | awk -F ': ' '$1 == "version" { print $2; exit }')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Gradle project version must use the form 1.0.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: ./gradlew clean build --no-daemon

      - name: Create GitHub release
        shell: bash
        run: >-
          gh release create "${{ steps.release.outputs.tag }}" build/libs/*.jar
          --title "${{ steps.release.outputs.tag }}"
          --target "$GITHUB_SHA"
          --generate-notes
